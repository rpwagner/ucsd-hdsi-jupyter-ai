<text x="45" y="382" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#17243C">At least 3 opened PRs per repository; licenses and project boundaries checked.</text>
<text x="45" y="416" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#17243C">The groups overlap: 4 accounts are in both. Unclassified is not “no overlap”.</text>
