<rect width="1280" height="720" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#15263b">
<title id="title">3. Let an external agent orchestrate</title><desc id="desc">The persona connects to a separate Goose process over ACP. Goose calls Ollama and the Jupyter MCP server separately. MCP tools use JSD and the notebook kernel.</desc>
<text x="640" y="49" text-anchor="middle" font-size="32" font-weight="bold" fill="#15263b">3. Let an external agent orchestrate</text>
<text x="640" y="85" text-anchor="middle" font-size="22" font-weight="normal" fill="#15263b">Same notebook • explicit approval • independently verify each effect</text>
<rect x="290" y="120" width="620" height="480" rx="12" fill="#eef3f9" stroke="#7c91ad" stroke-width="2" stroke-dasharray="9 6"/>
<text x="600" y="157" text-anchor="middle" font-size="24" font-weight="bold" fill="#15263b">Teaching container</text>
<rect x="30" y="225" width="200" height="145" rx="12" fill="#fff" stroke="#b3bfcd" stroke-width="2"/>
<text x="130" y="269" text-anchor="middle" font-size="25" font-weight="bold" fill="#15263b">Browser</text>
<text x="130" y="307" text-anchor="middle" font-size="20" font-weight="normal" fill="#15263b">Notebook + chat</text>
<text x="130" y="342" text-anchor="middle" font-size="18" font-weight="normal" fill="#15263b">outside image</text>
<rect x="330" y="205" width="350" height="290" rx="12" fill="#fff" stroke="#b3bfcd" stroke-width="2"/>
<text x="505" y="242" text-anchor="middle" font-size="23" font-weight="bold" fill="#15263b">Jupyter Server process</text>
<rect x="352" y="263" width="306" height="92" rx="12" fill="#dce9fa" stroke="#315c9b" stroke-width="2"/>
<text x="505" y="299" text-anchor="middle" font-size="23" font-weight="bold" fill="#15263b">Jupyter AI persona</text>
<text x="505" y="331" text-anchor="middle" font-size="20" font-weight="normal" fill="#15263b">ACP client</text>
<path d="M230 315H330" fill="none" stroke="#46576c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="280" y="294" text-anchor="middle" font-size="17" font-weight="normal" fill="#15263b">HTTP / WS</text>
<rect x="352" y="375" width="306" height="45" rx="12" fill="#e6f3ec" stroke="#39825a" stroke-width="2"/>
<text x="505" y="405" text-anchor="middle" font-size="22" font-weight="bold" fill="#15263b">Jupyter MCP server</text>
<rect x="352" y="440" width="306" height="45" rx="12" fill="#fff" stroke="#b3bfcd" stroke-width="2"/>
<text x="505" y="470" text-anchor="middle" font-size="22" font-weight="bold" fill="#15263b">JSD / document state</text>
<path d="M505 420V440" fill="none" stroke="#46576c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="355" y="525" width="285" height="60" rx="12" fill="#fff" stroke="#b3bfcd" stroke-width="2"/>
<text x="497" y="552" text-anchor="middle" font-size="21" font-weight="bold" fill="#15263b">Python kernel process</text>
<text x="497" y="577" text-anchor="middle" font-size="17" font-weight="normal" fill="#15263b">live variables + execution</text>
<path d="M400 485V525" fill="none" stroke="#46576c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="516" y="514" text-anchor="middle" font-size="17" font-weight="normal" fill="#15263b">Jupyter / ZeroMQ</text>
<rect x="695" y="525" width="180" height="60" rx="12" fill="#fff" stroke="#b3bfcd" stroke-width="2"/>
<text x="785" y="552" text-anchor="middle" font-size="21" font-weight="bold" fill="#15263b">Notebook files</text>
<text x="785" y="577" text-anchor="middle" font-size="17" font-weight="normal" fill="#15263b">source + outputs</text>
<path d="M600 485V515H785V525" fill="none" stroke="#46576c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="840" y="510" text-anchor="middle" font-size="17" font-weight="normal" fill="#15263b">file I/O</text>
<rect x="960" y="190" width="290" height="270" rx="12" fill="#fff" stroke="#7c91ad" stroke-width="2" stroke-dasharray="9 6"/>
<text x="1105" y="225" text-anchor="middle" font-size="22" font-weight="bold" fill="#15263b">Existing host service</text>
<rect x="980" y="260" width="250" height="155" rx="12" fill="#fff" stroke="#b3bfcd" stroke-width="2"/>
<text x="1105" y="298" text-anchor="middle" font-size="24" font-weight="bold" fill="#15263b">Ollama</text>
<text x="1105" y="337" text-anchor="middle" font-size="21" font-weight="normal" fill="#15263b">gpt-oss:20b</text>
<text x="1105" y="378" text-anchor="middle" font-size="18" font-weight="normal" fill="#15263b">port 11434 • no secret</text>
<rect x="725" y="270" width="155" height="145" rx="12" fill="#f2eafb" stroke="#8055a3" stroke-width="2"/>
<text x="802" y="308" text-anchor="middle" font-size="25" font-weight="bold" fill="#15263b">Goose</text>
<text x="802" y="343" text-anchor="middle" font-size="18" font-weight="normal" fill="#15263b">agent process</text>
<text x="802" y="380" text-anchor="middle" font-size="17" font-weight="normal" fill="#15263b">model/tool loop</text>
<path d="M658 292H725" fill="none" stroke="#315c9b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="705" y="255" text-anchor="middle" font-size="19" font-weight="bold" fill="#315c9b">ACP / stdio</text>
<path d="M805 270V180H940V292H980" fill="none" stroke="#315c9b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1050" y="163" text-anchor="middle" font-size="19" font-weight="bold" fill="#315c9b">OpenAI-compatible HTTP API</text>
<path d="M805 415V505H700V397H658" fill="none" stroke="#315c9b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="802" y="488" text-anchor="middle" font-size="19" font-weight="bold" fill="#315c9b">MCP / HTTP</text>
<text x="640" y="641" text-anchor="middle" font-size="23" font-weight="bold" fill="#15263b">ACP connects chat to the agent. MCP connects the agent to tools.</text>
<text x="640" y="679" text-anchor="middle" font-size="19" font-weight="normal" fill="#15263b">The model API remains a separate connection. The same JSD document and kernel are used.</text>
</g></svg>
